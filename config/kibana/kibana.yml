# ============================================================
# Kibana v8 — HTTPS côté navigateur + TLS vers Elasticsearch
# ============================================================
server.name: kibana
server.host: "0.0.0.0"
server.publicBaseUrl: "https://<ELK_HOST_IP>:5601"

# --- Phase 04 : HTTPS navigateur (5601) ---
server.ssl.enabled: true
server.ssl.certificate: config/certs/kibana/kibana.crt
server.ssl.key: config/certs/kibana/kibana.key

# --- Connexion à Elasticsearch avec un compte restreint ---
elasticsearch.hosts: [ "https://es-node1:9200" ]
elasticsearch.username: "kibana_system"
elasticsearch.password: "${KIBANA_SYSTEM_PASSWORD}"
elasticsearch.ssl.certificateAuthorities: [ "config/certs/ca/ca.crt" ]
elasticsearch.ssl.verificationMode: full

# --- Chiffrement des objets sauvegardés (requis par Fleet / alertes) ---
xpack.encryptedSavedObjects.encryptionKey: "${KIBANA_ENCRYPTION_KEY}"
xpack.security.encryptionKey: "${KIBANA_ENCRYPTION_KEY}"
xpack.reporting.encryptionKey: "${KIBANA_ENCRYPTION_KEY}"

# --- Phase 06 : Fleet ---
xpack.fleet.agents.fleet_server.hosts: [ "https://<ELK_HOST_IP>:8220" ]
xpack.fleet.outputs:
  - id: es-secure-output
    name: "Elasticsearch TLS"
    type: elasticsearch
    is_default: true
    is_default_monitoring: true
    hosts: [ "https://<ELK_HOST_IP>:9200" ]
    ca_trusted_fingerprint: "REMPLACER_PAR_EMPREINTE_SHA256_DE_LA_CA"
