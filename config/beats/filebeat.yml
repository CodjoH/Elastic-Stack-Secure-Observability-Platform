# Sortie Elasticsearch des Beats sur Client-Lin01 (7.17.10, phase 05).
# Même bloc pour filebeat, metricbeat, auditbeat, heartbeat et packetbeat.
# Remplacés par Elastic Agent en phase 06.

output.elasticsearch:
  hosts: [ "https://${ELK_HOST}:9200" ]
  username: "${ES_USER}"
  password: "${ES_PWD}"          # dans le keystore du Beat, pas en clair
  ssl.certificate_authorities: [ "/etc/filebeat/certs/ca.crt" ]
  ssl.verification_mode: full

setup.kibana:
  host: "https://${ELK_HOST}:5601"
  ssl.certificate_authorities: [ "/etc/filebeat/certs/ca.crt" ]
