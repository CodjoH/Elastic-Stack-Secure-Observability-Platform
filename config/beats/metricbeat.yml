# ============================================================
# Metricbeat — configuration historique (Phase 05)
# Remplacée par l'intégration "System" d'Elastic Agent (Phase 06)
# ============================================================
metricbeat.modules:
  - module: system
    metricsets: [ cpu, memory, network, process, filesystem ]
    period: 30s

output.elasticsearch:
  hosts: [ "https://192.168.56.51:9200" ]
  username: "metricbeat_writer"
  password: "${METRICBEAT_PASSWORD}"
  ssl.certificate_authorities: [ "/etc/metricbeat/certs/ca.crt" ]
  ssl.verification_mode: full
