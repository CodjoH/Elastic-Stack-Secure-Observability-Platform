version: '3.8'
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.4
    container_name: elasticsearch
    environment:
      - node.name=es-node1
      - cluster.name=cyber-cluster
      - discovery.seed_hosts=elasticsearch-node2
      - cluster.initial_master_nodes=es-node1,es-node2
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - path.repo=/usr/share/elasticsearch/snapshots
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.certificate=certs/es-http/elasticsearch.crt
      - xpack.security.http.ssl.key=certs/es-http/elasticsearch.key
      - xpack.security.http.ssl.client_authentication=optional
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.security.transport.ssl.certificate=certs/es-node1/es-node1.crt
      - xpack.security.transport.ssl.key=certs/es-node1/es-node1.key
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ${SNAPSHOTS_DIR}:/usr/share/elasticsearch/snapshots
      - ${CERTS_DIR}:/usr/share/elasticsearch/config/certs:ro
    ports:
      - "9200:9200"

  elasticsearch-node2:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.4
    container_name: elasticsearch-node2
    environment:
      - node.name=es-node2
      - cluster.name=cyber-cluster
      - discovery.seed_hosts=elasticsearch
      - cluster.initial_master_nodes=es-node1,es-node2
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - path.repo=/usr/share/elasticsearch/snapshots
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.certificate=certs/es-http/elasticsearch.crt
      - xpack.security.http.ssl.key=certs/es-http/elasticsearch.key
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.security.transport.ssl.certificate=certs/es-node2/es-node2.crt
      - xpack.security.transport.ssl.key=certs/es-node2/es-node2.key
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data_node2:/usr/share/elasticsearch/data
      - ${SNAPSHOTS_DIR}:/usr/share/elasticsearch/snapshots
      - ${CERTS_DIR}:/usr/share/elasticsearch/config/certs:ro
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.4
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=/usr/share/kibana/config/certs/ca/ca.crt
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_CERTIFICATE=/usr/share/kibana/config/certs/kibana/kibana.crt
      - SERVER_SSL_KEY=/usr/share/kibana/config/certs/kibana/kibana.key
      # clés persistantes : sans elles, Kibana en génère de nouvelles à chaque démarrage
      # et les règles / connecteurs / Cases chiffrés deviennent illisibles (phase 10)
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ESO_KEY}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_SECURITY_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_REPORTING_KEY}
    volumes:
      - ${CERTS_DIR}:/usr/share/kibana/config/certs:ro
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

volumes:
  es_data:
    driver: local
  es_data_node2:
    driver: local
